<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Infinity Symbol -->
  <path d="M30,50 
           C30,35 40,25 50,25 
           C60,25 65,35 70,40 
           C75,35 80,25 90,25 
           C100,25 105,35 105,50 
           C105,65 95,75 85,75 
           C75,75 70,65 65,60 
           C60,65 55,75 45,75 
           C35,75 30,65 30,50Z" 
        fill="none" 
        stroke="url(#aionGradient)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#glow)"
        transform="translate(-17.5, 0) scale(1.1)"
        opacity="0.9"/>
        
  <!-- Center dot accent -->
  <circle cx="50" cy="50" r="4" fill="#7C3AED" opacity="0.8"/>
</svg>
