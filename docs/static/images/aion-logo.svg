<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="infinityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
    <!-- Standard Infinity Symbol -->
  <g id="infinity">
    <path d="M 30,18 C 30,8 42,8 50,15 C 58,8 70,8 70,18 C 70,28 58,28 50,21 C 42,28 30,28 30,18Z" 
          fill="none" 
          stroke="url(#infinityGradient)" 
          stroke-width="4.5" 
          stroke-linecap="round"
          filter="url(#glow)"
          opacity="0.95"/>
    <circle cx="50" cy="18" r="3" fill="#7C3AED" opacity="0.9"/>
  </g>
  
  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="38" stroke="url(#agentGradient)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="50" cy="27" r="4" fill="url(#agentGradient)" filter="url(#glow)" />
  
  <!-- Agent Body -->
  <g id="agent-body">
    <!-- Head -->
    <circle cx="50" cy="55" r="22" fill="url(#agentGradient)" filter="url(#glow)" />
    
    <!-- Face -->
    <circle cx="50" cy="53" r="16" fill="white" opacity="0.95" />
    
    <!-- Eyes -->
    <ellipse cx="44" cy="50" rx="3.5" ry="4.5" fill="#7C3AED" />
    <ellipse cx="56" cy="50" rx="3.5" ry="4.5" fill="#7C3AED" />
    
    <!-- Eye highlights -->
    <circle cx="45" cy="49" r="1.5" fill="white" />
    <circle cx="57" cy="49" r="1.5" fill="white" />
    
    <!-- Mouth -->
    <path d="M 44 58 Q 50 62 56 58" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Body -->
    <rect x="33" y="80" width="34" height="24" rx="10" fill="url(#agentGradient)" filter="url(#glow)" />
    
    <!-- Body detail -->
    <rect x="39" y="86" width="22" height="12" rx="5" fill="white" opacity="0.3" />
    
    <!-- Arms -->
    <path d="M 28 85 Q 20 92 20 98" fill="none" stroke="url(#agentGradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M 72 85 Q 80 92 80 98" fill="none" stroke="url(#agentGradient)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
