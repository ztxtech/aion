<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Purple Circle with White Infinity Symbol -->
  <circle cx="50" cy="45" r="35" fill="url(#circleGradient)" />
  
  <!-- White Infinity Symbol -->
  <path d="M 35,45 C 35,38 42,38 50,42 C 58,38 65,38 65,45 C 65,52 58,52 50,48 C 42,52 35,52 35,45Z" 
        fill="none" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round"/>
  
  <!-- Small Body -->
  <rect x="42" y="82" width="16" height="12" rx="4" fill="url(#circleGradient)" />
  
  <!-- Two Arms -->
  <path d="M 38 88 L 30 92" fill="none" stroke="url(#circleGradient)" stroke-width="3" stroke-linecap="round" />
  <path d="M 62 88 L 70 92" fill="none" stroke="url(#circleGradient)" stroke-width="3" stroke-linecap="round" />
</svg>
